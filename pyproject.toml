[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-datacenter_env"
version = "0.1.0"
description = "Datacenter AI environment for OpenEnv hackathon"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "requests",
    "openenv-core"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m datacenter_env.server.app
server = "datacenter_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["datacenter_env", "datacenter_env.server"]
package-dir = { "datacenter_env" = ".", "datacenter_env.server" = "server" }

